# Alembic CLI for developers (new revisions, history). The application and the
# migrate ECS task use `python -m backend.app.db.migrate`, which needs no ini.
#   alembic revision -m "add x"      # creates backend/app/db/migrations/versions/<id>_add_x.py
#   alembic upgrade head
# Connection settings come from DATABASE_URL or DATABASE_* (see .env.example).
[alembic]
script_location = backend/app/db/migrations
prepend_sys_path = .

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
