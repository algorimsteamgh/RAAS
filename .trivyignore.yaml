# Accepted Trivy findings (owner decision, 2026-11-16). The CI security scan
# reads this file; every other finding still fails the build.

misconfigurations:
  # The app tasks reach Bedrock, ECR, SQS, Secrets Manager and CloudWatch
  # through the NAT gateway. There are no VPC interface endpoints, to keep the
  # cost down, so egress has to be open. Revisit if endpoints are added.
  - id: AWS-0104
    paths:
      - "infra/aws/network.tf"
    statement: "Accepted: app egress goes through NAT to AWS APIs (no interface endpoints)."
